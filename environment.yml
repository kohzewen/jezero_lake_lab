# Conda environment for the Jezero open-basin lake lab.
#   conda env create -f environment.yml
#   conda activate mars-gis-lab
#   jupyter lab
name: mars-gis-lab
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib>=3.7
  - gdal>=3.6
  - rasterio>=1.3
  - rioxarray>=0.15
  - xarray
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.5
  - pandas
  - astropy
  - jupyterlab>=4
  - ipympl>=0.9
  - ipywidgets>=8
